[project]
name = "simpleagent"
version = "0.2.1"
description = "自用、可学习的本地 agent：从零手写 agent loop，接入 OpenAI 兼容协议"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "croniter>=6.2",
    "openai>=3.14.1",
    "pydantic>=2.13.5",
]

[project.scripts]
sa = "simpleagent.cli:main"
# 长名字：macOS 自带 /usr/sbin/sa，launchd 等 PATH 很短的环境里 sa 会撞名
simple_agent = "simpleagent.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
