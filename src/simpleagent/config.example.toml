# SimpleAgent 配置文件
# 位置：~/.simpleagent/config.toml（可用环境变量 SIMPLEAGENT_HOME 改数据目录）
# api_key_env 只写环境变量名，不要把 key 本身写进来。
# key 的值二选一：export 成环境变量，或写到同目录的 .env 文件（每行 NAME=VALUE，建议 chmod 600）：
#   DEEPSEEK_API_KEY=sk-...
# 模型 ID 会随厂商更新变化，以各家官方文档为准。

default_profile = "deepseek"
show_reasoning = true
# max_steps = 20   # 一轮对话最多请求模型几次，防止模型无限调用工具
# system_prompt = "你是 SimpleAgent，一个运行在用户本地电脑上的个人助手。回答简洁、准确。"

[trace]
enabled = true      # 每次请求/响应写到 ~/.simpleagent/traces/<session>/
raw_chunks = false  # 想研究 SSE 流式协议时打开

[tool_output]
max_chars = 30000   # 工具结果回给模型的字符上限，超出只留开头
max_lines = 500     # 行数上限（两个上限都要满足）；完整内容存 ~/.simpleagent/tool_outputs/，保留 7 天
# read_file 自己分页（约 3 万字符或 limit 行），不受这里限制

# [context]
# clear_at = 0.6          # 上下文占到输入上限（窗口 − 给输出留的余量）的这个比例，就清理旧工具结果：
#                         # 换成占位符，原文存到 tool_outputs/，模型需要时用 read_file 读回来；0 = 关闭
# keep_tool_results = 3   # 最近几个工具结果保留原样
# compact_at = 0.8        # 清理之后还占到这个比例，就调 LLM 把早期对话压成摘要，保留最近约 1/4 的原文；
#                         # 会多一次请求，之后的前缀缓存也会失效，所以排在清理之后；0 = 关闭

# ---------------------------------------------------------------- 项目指令、记忆、技能（M7）
# 三样都在会话开始时读一次、之后不变（中途改了文件，下个会话生效）：system prompt 一变，前缀缓存就全部失效。
# REPL 里 /prompt 看拼出来的 system prompt，/memory、/skills 看各自的状态。

# [instructions]
# enabled = true
# filenames = ["AGENTS.md", "CLAUDE.md"]  # 每个目录取第一个存在的；个人的放 ~/.simpleagent/AGENTS.md，
#                                         # 项目的从 git 根目录一路找到 cwd，不在 git 仓库里只看 cwd
# max_chars = 32000                       # 全部指令加起来的字数上限，超出的截掉并告诉模型原文在哪

# [memory]
# enabled = true           # ~/.simpleagent/memory/：每条记忆一个 .md，MEMORY.md 索引进 system prompt
# confirm_writes = true    # memory_write / memory_delete 先问一句；sa run 里没人确认就拒绝，
#                          # 定时任务要写记忆用 --allow memory_write

# [skills]
# enabled = true
# dirs = [".agents/skills", ".claude/skills"]  # 除了 ~/.simpleagent/skills/<名字>/SKILL.md 还从哪找：
#                                              # 相对路径按 git 根目录到 cwd 的每一层解析，绝对路径照原样；
#                                              # 加上 "~/.claude/skills" 就能直接用 Claude Code 的个人技能

# [debug]
# enabled = false   # 交互时显示 API 调用和工具调用的过程（也可 sa --debug、REPL 里 /debug on）
# verbose = true    # 再加每轮的消息清单（role + 字符数）和请求开关；过程输出走 stderr
# full = true       # 再加发给模型的消息正文和模型返回的结构；正文会进 stderr，日志别外传
# body_chars = 600  # full 档里每段正文的字符上限，0 = 不截断

# [panel]
# archive_after_minutes = 30   # 控制面板的消息点开后多久移进归档；没点开的不会自动归档

# [command]
# profile = "deepseek"   # 指挥台调度者用的模型，不填用 default_profile。它只负责把任务派给空间、汇总结果

# ---------------------------------------------------------------- DeepSeek
[profiles.deepseek]
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
model = "deepseek-flash"  # 可用模型：GET https://api.deepseek.com/models
context_window = 128000

[profiles.deepseek.quirks]
reasoning_field = "reasoning_content"
# 思考模式下的工具调用需要回传本轮的 reasoning_content（以官方文档为准）
reasoning_echo = "current_turn"
# 前缀缓存命中数在 usage.prompt_cache_hit_tokens，客户端已兼容

# ---------------------------------------------------------------- 智谱 GLM
[profiles.glm]
base_url = "https://open.bigmodel.cn/api/paas/v4"
api_key_env = "ZHIPU_API_KEY"
model = "glm-4.6"  # 换成官方最新模型 ID
context_window = 128000

[profiles.glm.extra_body]
thinking = { type = "enabled" }  # 厂商私有参数：思考开关

# ---------------------------------------------------------------- 通义千问（DashScope 兼容模式）
[profiles.qwen]
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "DASHSCOPE_API_KEY"
model = "qwen-plus"
context_window = 128000

[profiles.qwen.extra_body]
enable_thinking = true

# ---------------------------------------------------------------- 本地 Ollama
[profiles.local]
base_url = "http://localhost:11434/v1"
model = "qwen3:8b"
# 要和 Ollama 实际的 num_ctx 一致：Ollama 超过 num_ctx 会悄悄截断输入而不是报错，
# 本地模型只能靠这里算出来的预算去清理、压缩，配大了就等于没有保护
context_window = 32000

[profiles.local.quirks]
reasoning_field = "reasoning"  # 新版 Ollama 的思考内容字段名

# ---------------------------------------------------------------- MCP server（M5）
# 每个 [mcp_servers.<名字>] 是一个 stdio MCP server，它的工具以 mcp__<名字>__<工具> 出现在模型面前。
# 注意：工作目录边界管不到 MCP 工具，server 能碰什么由它自己的参数决定——
# 下面给 filesystem server 的目录，就是它能读写的全部范围。
# [mcp_servers.filesystem]
# command = "npx"
# args = ["--prefer-offline", "-y", "@modelcontextprotocol/server-filesystem", "~/notes"]
#                                # --prefer-offline：本地有缓存就不联网。不加的话 npx 每次启动都查最新版，
#                                # 连不上 npm 仓库时会一直挂到 startup_timeout
# env = { LOG_LEVEL = "info" }   # 不是秘密的设置，原样传给 server
# env_vars = ["GITHUB_TOKEN"]    # 需要密钥的 server（这里只是示例）：只写变量名，值放环境变量或
#                                # ~/.simpleagent/.env。其余环境变量默认不传，只给 HOME / PATH / LANG / 代理这些
# cwd = "~"                      # server 进程的工作目录，默认继承 sa 的
# enabled = true
# start = "eager"                # eager：sa 启动时就拉起来；lazy：按需启动——用上次连上时缓存的工具清单
#                                # 登记工具，模型第一次调用时才启动。没缓存时照常启动一次，之后才按需
# protocol = "auto"              # auto：先探测新协议，不行退回旧协议；也可以写 modern / legacy
# startup_timeout = 60           # 启动 + 列工具的总时限（npx 第一次要下载）
# tool_timeout = 60              # 单次调用的时限
# enabled_tools = ["read_text_file", "list_directory"]   # 只暴露这些（用 server 原本的工具名）
# disabled_tools = ["move_file"]                         # 不暴露这些
# trust_annotations = true       # 相信 server 标的 readOnlyHint：只读工具免确认、可并行
# permissions = { write_file = "allow" }                 # 按工具覆盖：allow 免确认 / ask 要确认
